[project]
name = "hermosillo-tramites"
version = "0.1.0"
description = "Entorno de desarrollo para la plataforma ciudadana de trámites de Hermosillo"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.101",
]

[tool.uv]
package = false
required-version = "==0.13.7"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.14"
